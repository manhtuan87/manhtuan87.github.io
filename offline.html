<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ケロちゃん ランド</title>
<style>
  html, body { margin: 0; height: 100%; background: linear-gradient(#aef0dd, #f1fffb); }
  body { display: flex; align-items: center; justify-content: center; font-family: 'M PLUS Rounded 1c', 'Jua', 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', sans-serif; color: #5a3825; }
  .card { width: 290px; padding: 22px 18px 24px; text-align: center; background: #fffaf2; border: 4px solid #5a3825; border-radius: 30px; box-shadow: 0 8px 0 rgba(90, 56, 37, .35); }
  p { font-size: 20px; font-weight: 800; line-height: 1.6; margin: 0 0 18px; }
  a { display: inline-block; padding: 12px 26px; font-size: 20px; font-weight: 800; color: #5a3825; text-decoration: none; background: linear-gradient(#fff 55%, #ffe6f1); border: 3px solid #5a3825; border-radius: 999px; box-shadow: 0 5px 0 #5a3825; }
</style>
</head>
<body>
<div class="card">
  <p><span id="m1">インターネットに つないでから</span><br><span id="m2">もういちど ひらいてね</span></p>
  <a id="m3" href="./">もどる</a>
</div>
<script>
  // the language chosen in the menu (see js/lang.js)
  (function () {
    var T = {
      vi: ['Hãy kết nối Internet', 'rồi mở lại nhé', 'Quay lại'],
      en: ['Connect to the internet', 'and open it again', 'Back'],
      ko: ['인터넷에 연결한 다음', '다시 열어 주세요', '돌아가기']
    };
    var lang = 'ja';
    try { lang = localStorage.getItem('kero-lang') || 'ja'; } catch (e) { /* ignore */ }
    var t = T[lang];
    if (!t) return;
    document.documentElement.lang = lang;
    ['m1', 'm2', 'm3'].forEach(function (id, i) { document.getElementById(id).textContent = t[i]; });
  }());
</script>
</body>
</html>
