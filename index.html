<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#aef0dd">
<meta name="mobile-web-app-capable" content="yes">
<title>ケロちゃん ランド</title>
<meta name="description" content="ケロちゃんの ゲームが あつまる ところ。あそびたい ゲームを えらんでね！">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Jua&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div id="stage">
  <div id="scroller" class="scroller">
    <h1 class="logo">
      <span class="l1"><b style="--d:0">ケ</b><b style="--d:1">ロ</b><b style="--d:2">ち</b><b style="--d:3">ゃ</b><b style="--d:4">ん</b></span>
      <span class="l2"><b style="--d:5">ラ</b><b style="--d:6">ン</b><b style="--d:7">ド</b></span>
    </h1>
    <p id="sub" class="sub">あそびたい ゲームを えらんでね！</p>
    <div class="island-space" aria-hidden="true"></div>
    <div id="games" class="games"></div>
    <p id="land-ver" class="land-ver"></p>
  </div>
  <div class="top-left">
    <button id="btn-lang" class="btn small icon" aria-label="ことば"><span class="ic" data-icon="globe"></span></button>
    <button id="btn-user" class="btn small user-btn"><i id="user-dot" class="udot"></i><span id="user-label">なまえ</span></button>
  </div>
  <div class="top-right">
    <button id="btn-install" class="btn small install" hidden><span class="ic" data-icon="install"></span>ホームに ついか</button>
    <button id="btn-snd" class="btn small icon" aria-label="タッチの おと"><span class="ic"></span></button>
  </div>
  <div id="users-panel" class="panel">
    <div class="panel-card">
      <div class="panel-title">だれが あそぶ？</div>
      <p class="panel-note">えらんだ 人で ぜんぶの ゲームを あそぶよ</p>
      <div id="user-list" class="user-list"></div>
      <button id="user-add" class="btn add-btn"><span class="ic" data-icon="plus"></span>ユーザーを ふやす</button>
      <div class="panel-row"><button id="users-close" class="btn">とじる</button></div>
    </div>
  </div>
  <div id="uedit-panel" class="panel">
    <div class="panel-card">
      <div class="panel-title">ユーザーの せってい</div>
      <input id="ue-name" class="name-input" type="text" maxlength="10" autocomplete="off" placeholder="れい：はなこちゃん">
      <div id="ue-type" class="seg"><button data-v="kid">こども</button><button data-v="adult">おとな</button></div>
      <div id="ue-color" class="swatches"></div>
      <div class="panel-row">
        <button id="ue-cancel" class="btn">やめる</button>
        <button id="ue-ok" class="btn ok">OK</button>
      </div>
      <button id="ue-del" class="btn del-btn">けす</button>
    </div>
  </div>
  <div id="lang-panel" class="panel">
    <div class="panel-card">
      <div class="panel-title">ことばを えらんでね</div>
      <p class="panel-note">ぜんぶの ゲームが この ことばに なるよ</p>
      <div id="lang-list" class="lang-list"></div>
      <div class="panel-row"><button id="lang-close" class="btn">とじる</button></div>
    </div>
  </div>
</div>
<script src="js/move.js"></script>
<script src="js/lang.js"></script>
<script src="js/lang-text.js"></script>
<script src="js/accounts.js"></script>
<script src="js/draw.js"></script>
<script src="js/land.js"></script>
</body>
</html>
